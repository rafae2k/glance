<!doctype html>
<!-- Abra este arquivo no Chrome. Toda interação detectável pela página
     aparece no log abaixo. Use os atalhos do glance e confirme que
     NENHUMA linha nova aparece. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>glance · teste de detecção</title>
<style>
  body { font: 14px/1.5 -apple-system, monospace; margin: 0; padding: 20px; background: #fff; }
  #status { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
  #log { white-space: pre-wrap; background: #111; color: #0f0;
         padding: 14px; border-radius: 10px; min-height: 200px; max-height: 70vh; overflow: auto; }
  .ok { color: #0f0 } .alerta { color: #f80; font-weight: 700 }
</style>
</head>
<body>
<div id="status">hasFocus(): <span id="hf">?</span> · visibility: <span id="vis">?</span></div>
<div id="log">— log de eventos detectáveis pela página —

</div>
<script>
const log = document.getElementById('log')
const hf = document.getElementById('hf'), vis = document.getElementById('vis')

function marca(t, classe) {
  const span = document.createElement('span')
  span.className = classe || ''
  span.textContent = `[${new Date().toLocaleTimeString('pt-BR')}] ${t}\n`
  log.appendChild(span); log.scrollTop = log.scrollHeight
  console.log('DETECTADO:', t)
}

// foco e visibilidade — o vetor principal
addEventListener('blur', () => marca('EVENTO: blur (página perdeu foco!)', 'alerta'))
addEventListener('focus', () => marca('EVENTO: focus'))
document.addEventListener('visibilitychange', () =>
  marca(`EVENTO: visibilitychange → ${document.visibilityState}`, 'alerta'))
addEventListener('pagehide', () => marca('EVENTO: pagehide', 'alerta'))

// teclado — nada deve chegar aqui enquanto tu usa os atalhos do glance
addEventListener('keydown', e =>
  marca(`EVENTO: keydown ${e.key} meta=${e.metaKey} shift=${e.shiftKey}`))
addEventListener('keyup', e => marca(`EVENTO: keyup ${e.key}`))

// mouse — cliques "atravessam" o overlay, movimentos continuam normais
addEventListener('mousedown', e => marca(`EVENTO: mousedown @${e.clientX},${e.clientY}`))
document.addEventListener('mouseleave', () => marca('EVENTO: mouseleave do documento'))

// área de transferência — o glance nunca cola nada, então só aparece se tu colar
addEventListener('paste', e => marca('EVENTO: paste (algo foi colado!)', 'alerta'))
addEventListener('copy', e => marca('EVENTO: copy'))

// tela cheia e compartilhamento
document.addEventListener('fullscreenchange', () => marca('EVENTO: fullscreenchange'))

// monitor periódico: se hasFocus mudar sem evento, também mostra
setInterval(() => {
  hf.textContent = document.hasFocus()
  vis.textContent = document.visibilityState
}, 300)

marca('página pronta. Agora: faça uma pergunta na tela, aperte ⌘⇧Space,')
marca('role o overlay com ⌘⇧↑/↓, mostre/esconda com ⌘⇧H.')
marca('SE NADA apareceu acima ⇑, a página não te viu.')
</script>
</body>
</html>
