<!doctype html>
<!-- Espelho local de compartilhamento de tela.
     Clique em "espelhar", escolha "Tela inteira", e depois
     dispare o glance (⌘⇧Space) e role o overlay.
     Se o setContentProtection estiver funcionando, o painel
     do glance NÃO aparece no espelho — só o que está por baixo dele. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>glance · espelho de captura</title>
<style>
  body { font: 14px -apple-system; margin: 0; background: #222; color: #eee;
         display: flex; flex-direction: column; align-items: center; padding: 20px; gap: 12px }
  video { max-width: 95vw; border: 2px solid #555; border-radius: 8px; background: #000 }
  button { font-size: 16px; padding: 8px 18px; border-radius: 8px; border: 0;
           background: #4a9eff; color: #fff; cursor: pointer }
</style>
</head>
<body>
<h2>Espelho de getDisplayMedia</h2>
<p>Agora: ⌘⇧Space com o glance, e olhe se o painel preto aparece no espelho.<br>
    <b>Não deve aparecer.</b> Só o que estiver por baixo dele.</p>
<button onclick="espelhar()">espelhar</button>
<video id="v" muted autoplay playsinline></video>
<script>
async function espelhar() {
  const stream = await navigator.mediaDevices.getDisplayMedia({ video: true })
  document.getElementById('v').srcObject = stream
}
</script>
</body>
</html>
