<!doctype html>
<!-- Privacy test: a local screen-share mirror.
     Click "mirror", pick "Entire screen", then trigger glance and scroll it.
     With content protection on, the glance panel does NOT show up in the
     mirror — only what's underneath it. Run with GLANCE_DEBUG=1 to see it
     appear instead. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>glance · privacy test</title>
<style>
  body { font: 14px -apple-system; margin: 0; background: #222; color: #eee;
         display: flex; flex-direction: column; align-items: center; padding: 20px; gap: 12px }
  video { max-width: 95vw; border: 2px solid #555; border-radius: 8px; background: #000 }
  button { font-size: 16px; padding: 8px 18px; border-radius: 8px; border: 0;
           background: #4a9eff; color: #fff; cursor: pointer }
</style>
</head>
<body>
<h2>Screen-share mirror</h2>
<p>Trigger glance and check whether its panel shows up in the mirror.
   <b>It shouldn't</b> — your assistant stays private during calls and recordings.</p>
<button onclick="mirror()">mirror</button>
<video id="v" muted autoplay playsinline></video>
<script>
async function mirror() {
  const stream = await navigator.mediaDevices.getDisplayMedia({ video: true })
  document.getElementById('v').srcObject = stream
}
</script>
</body>
</html>
